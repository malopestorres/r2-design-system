    <rect x="16" y="16" width="48" height="48" rx="8" fill="#18181C" stroke="#3F3F4A" stroke-width="1" />
    <text x="76" y="34" class="token-name">neutral.850</text>
    <text x="76" y="52" class="token-hex">#18181C</text>
    <text x="16" y="92" class="token-desc">Cards e containers visuais</text>
