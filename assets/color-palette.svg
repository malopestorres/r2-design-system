  <!-- Token 7: neutral.700 -->
  <g transform="translate(676, 235)">
    <rect width="195" height="115" rx="12" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="16" y="16" width="48" height="48" rx="8" fill="#2D2D36" stroke="#3F3F4A" stroke-width="1" />
    <text x="76" y="34" class="token-name">neutral.700</text>
    <text x="76" y="52" class="token-hex">#2D2D36</text>
    <text x="16" y="92" class="token-desc">Bordas e divisores</text>
