<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="r2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <style>
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 18px; fill: #FAFAFA; }
      .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 13px; fill: #A1A1AA; }
      .section-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #FF5722; text-transform: uppercase; letter-spacing: 0.05em; }
      .token-name { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; fill: #FAFAFA; }
      .token-name-light { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; fill: #18181B; }
      .token-hex { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 12px; fill: #A1A1AA; }
      .token-hex-light { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 12px; fill: #71717A; }
      .token-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #71717A; }
    </style>
  </defs>

  <!-- Container Background -->
  <rect width="900" height="480" rx="16" fill="#09090B" stroke="#2D2D36" stroke-width="1.5" />

  <!-- Header -->
  <text x="28" y="38" class="title">R2 Agência Digital — Dual Theme Visual Tokens</text>
  <text x="28" y="58" class="subtitle">Paleta de cores oficial com suporte nativo a Dark Theme &amp; Light Theme</text>
  <line x1="28" y1="74" x2="872" y2="74" stroke="#2D2D36" stroke-width="1" />

  <!-- SECTION 1: BRAND CORE -->
  <text x="28" y="96" class="section-label">1. Cores de Marca (Brand Primary)</text>
  
  <g transform="translate(28, 108)">
    <rect width="265" height="95" rx="10" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="14" y="14" width="42" height="42" rx="8" fill="#FF5722" />
    <text x="68" y="32" class="token-name">brand.500</text>
    <text x="68" y="48" class="token-hex">#FF5722</text>
    <text x="14" y="78" class="token-desc">Cor primária da marca R2</text>
  </g>

  <g transform="translate(317, 108)">
    <rect width="265" height="95" rx="10" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="14" y="14" width="42" height="42" rx="8" fill="#FF3D00" />
    <text x="68" y="32" class="token-name">brand.600</text>
    <text x="68" y="48" class="token-hex">#FF3D00</text>
    <text x="14" y="78" class="token-desc">Destaque &amp; Hover vibrante</text>
  </g>

  <g transform="translate(606, 108)">
    <rect width="265" height="95" rx="10" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="14" y="14" width="42" height="42" rx="8" fill="url(#r2Gradient)" />
    <text x="68" y="32" class="token-name">brand.gradient</text>
    <text x="68" y="48" class="token-hex">#FF6B00 ➔ #FF3D00</text>
    <text x="14" y="78" class="token-desc">Gradiente oficial R2</text>
  </g>

  <!-- SECTION 2: DARK THEME SURFACES -->
  <text x="28" y="232" class="section-label">2. Escala Dark Theme</text>

  <g transform="translate(28, 244)">
    <rect width="200" height="95" rx="10" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="14" y="14" width="42" height="42" rx="8" fill="#09090B" stroke="#3F3F4A" stroke-width="1" />
    <text x="68" y="32" class="token-name">dark.950</text>
    <text x="68" y="48" class="token-hex">#09090B</text>
    <text x="14" y="78" class="token-desc">Fundo principal</text>
  </g>

  <g transform="translate(244, 244)">
    <rect width="200" height="95" rx="10" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="14" y="14" width="42" height="42" rx="8" fill="#121215" stroke="#3F3F4A" stroke-width="1" />
    <text x="68" y="32" class="token-name">dark.900</text>
    <text x="68" y="48" class="token-hex">#121215</text>
    <text x="14" y="78" class="token-desc">Superfície elevada</text>
  </g>

  <g transform="translate(460, 244)">
    <rect width="200" height="95" rx="10" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="14" y="14" width="42" height="42" rx="8" fill="#18181C" stroke="#3F3F4A" stroke-width="1" />
    <text x="68" y="32" class="token-name">dark.850</text>
    <text x="68" y="48" class="token-hex">#18181C</text>
    <text x="14" y="78" class="token-desc">Card background</text>
  </g>

  <g transform="translate(676, 244)">
    <rect width="195" height="95" rx="10" fill="#121215" stroke="#2D2D36" stroke-width="1" />
    <rect x="14" y="14" width="42" height="42" rx="8" fill="#2D2D36" stroke="#3F3F4A" stroke-width="1" />
    <text x="68" y="32" class="token-name">dark.700</text>
    <text x="68" y="48" class="token-hex">#2D2D36</text>
    <text x="14" y="78" class="token-desc">Bordas Dark</text>
  </g>

  <!-- SECTION 3: LIGHT THEME SURFACES -->
  <text x="28" y="368" class="section-label">3. Escala Light Theme (Fundo Claro)</text>

  <g transform="translate(28, 380)">
    <rect width="200" height="85" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <rect x="14" y="14" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5" />
    <text x="62" y="30" class="token-name-light">light.50</text>
    <text x="62" y="46" class="token-hex-light">#FFFFFF</text>
    <text x="14" y="70" class="token-desc">Fundo claro principal</text>
  </g>

  <g transform="translate(244, 380)">
    <rect width="200" height="85" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <rect x="14" y="14" width="38" height="38" rx="8" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1.5" />
    <text x="62" y="30" class="token-name-light">light.100</text>
    <text x="62" y="46" class="token-hex-light">#F4F4F5</text>
    <text x="14" y="70" class="token-desc">Superfície elevada</text>
  </g>

  <g transform="translate(460, 380)">
    <rect width="200" height="85" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <rect x="14" y="14" width="38" height="38" rx="8" fill="#E4E4E7" stroke="#D4D4D8" stroke-width="1.5" />
    <text x="62" y="30" class="token-name-light">light.200</text>
    <text x="62" y="46" class="token-hex-light">#E4E4E7</text>
    <text x="14" y="70" class="token-desc">Card fundo claro</text>
  </g>

  <g transform="translate(676, 380)">
    <rect width="195" height="85" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <rect x="14" y="14" width="38" height="38" rx="8" fill="#D4D4D8" stroke="#A1A1AA" stroke-width="1.5" />
    <text x="62" y="30" class="token-name-light">light.300</text>
    <text x="62" y="46" class="token-hex-light">#D4D4D8</text>
    <text x="14" y="70" class="token-desc">Bordas Light</text>
  </g>
</svg>
